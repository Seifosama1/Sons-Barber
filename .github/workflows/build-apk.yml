name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Sons Barber Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets (Vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SERVICE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_KEY }}

      - name: Sync with Capacitor
        run: npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (For Phone Testing)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Release AAB (For Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SonsBarber-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: SonsBarber-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
